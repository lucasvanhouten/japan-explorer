.fixed{font-size:.61rem;color:var(--dim);width:5.8rem;text-align:center;line-height:1.3;display:inline-block}
/* the flight home, the one line the list still keeps between rows */
.legrow{display:flex;align-items:center;flex-wrap:wrap;gap:0 .4rem;padding:.3rem 0 .3rem 2.6rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;color:var(--ink2)}
.legrow b{color:var(--ink);font-weight:800}

.row .legin{font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;color:var(--ink2);white-space:nowrap;flex:none}
.row .legin::before{content:"";display:inline-block;width:1px;height:14px;background:var(--hair2);vertical-align:-2px;margin:0 1rem 0 .5rem}
.row .legin b{color:var(--ink);font-weight:800}
.row .legin.q b{color:var(--warn)}
/* dashed rows: the rail goes hollow and the fill goes, but the type holds its contrast */
/* hanging off the rail, not standing on it: indented clear of the line, and carrying about seven-tenths of a solid
   row's vertical padding so a run of options never outweighs the stops between them */
.row.ghost{cursor:pointer;margin-left:1.4rem;padding-top:.48rem;padding-bottom:.48rem;background:transparent;border-left:4px dashed var(--hair2);box-shadow:inset 0 0 0 1px var(--hair);border-radius:0 4px 4px 0}
.row.ghost .no{color:var(--dim)}
.row.ghost .nmt{font-size:.88rem;font-weight:600;color:var(--ink2)}
.row.ghost .kindtag{color:var(--dim)}
/* not yet on the route: name, kind and the line are one flowing block — the line starts on the name's own line and
   wraps under it when it runs out of width. It is never cut (owner, 2026-09-12) */
.row.ghost .nm{display:block}
.row.ghost .nmt,.row.ghost .kindtag,.row.ghost .d{display:inline}
.row.ghost .nmt{margin-right:.34rem}
.row.ghost .kindtag{margin-right:.4rem}
.row.ghost .gl{margin-right:.34rem}
.row.ghost .d{margin:0;color:var(--ink2)}
.row.ghost:hover .nmt{color:var(--ink)}
.row.ghost.c:hover{border-left-color:var(--dc)}
.row.ghost.i:hover{border-left-color:var(--verm)}
.row.ghost.s:hover{border-left-color:var(--warn)}
.row.ghost.dis{cursor:default}
.row.ghost.dis .nmt{color:var(--dim)}

<script>
const C={tokyo:"Tokyo",kyoto:"Kyoto",osaka:"Osaka",nara:"Nara",hakone:"Near Fuji",kawaguchiko:"Lake Kawaguchi",nikko:"Nikkō",kanazawa:"Kanazawa",yamashiro:"Kaga",takayama:"Takayama",hiroshima:"Hiroshima",miyajima:"Miyajima",naoshima:"Naoshima",tomonoura:"Tomonoura",arima:"Arima",kinosaki:"Kinosaki",katsuragi:"Kōyasan",tanigawa:"Snow country",echigoyuzawa:"Yuzawa",yudanaka:"Yudanaka",sendai:"Sendai",nyuto:"Nyūtō",kakunodate:"Kakunodate",tsuchiyu:"Tsuchiyu",sukagawa:"Sukagawa",kirishima:"Kirishima",kagoshima:"Kagoshima",fukuoka:"Fukuoka",takeo:"Takeo",nagasaki:"Nagasaki",unzen:"Unzen",hita:"Amagase",yufuin:"Yufuin",beppu:"Beppu",kurokawa:"Kurokawa",takachiho:"Takachiho",kumamoto:"Kumamoto",amakusa:"Amakusa",sapporo:"Sapporo",niseko:"Niseko",noboribetsu:"Noboribetsu"};
const CITY=new Set(["tokyo","kyoto","osaka","kanazawa","takayama","hiroshima","sendai","kagoshima","fukuoka","nagasaki","kumamoto","sapporo"]);
const KIND={city:"CITY",inn:"RYOKAN",stop:"STOP",end:"END"};
/* the spine data is spines.json verbatim, loaded from route-explorer-data.js — never a second copy here */
const spines=SPINES;
// ---------- state
const sel={},nightsOv={};
const esc=x=>String(x).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
/* the assembler mirrors builder/route.js exactly (spines v2, 2026-09-13): the spine's cities in trip order, each city's
 * attachment beside it, each leg's yes/no slots between its two cities, the END night last; a reverse option turns the
 * middle round; an attachment whose city, or a slot whose leg, is not on this assembly is not offered, and nor is an
 * option whose requires / not_with rule fails — a default that fails falls back to No. Nights start at the ideal low, a
 * repeated city splits 3/2 (Tokyo) or ideal-low/1 — the later visit at one night only when it is the airport-side night */
const asList=v=>v==null?[]:Array.isArray(v)?v:[v];
const legKeyOf=lg=>lg.key||asList(lg.from)[0]+"-"+asList(lg.to)[0];
const yesNo=(y,owner)=>({kind:y.kind||"stop",key:y.key,question:y.question,default:y.default==null?1:y.default,on_at:y.on_at,fill:y.fill,owner,
 options:[{label:"Yes",desc:y.desc,stops:y.stops||[],requires:y.requires,not_with:y.not_with,or_in:y.or_in,why_not:y.why_not,in:y.in,out:y.out,
   needCity:owner.type==="city"?owner.city:null,needLeg:owner.type==="leg"?{from:owner.from,to:owner.to}:null},
  {label:"No",desc:y.no||"Straight through.",stops:[]}]});
const DECS={};
function decs(sp){if(DECS[sp.id])return DECS[sp.id];const out=[],at=sp.attach||[],lgs=sp.legs||[],dA=new Set(),dL=new Set();
 const push=locs=>{at.forEach((a,i)=>{if(dA.has(i)||!asList(a.city).some(c=>locs.includes(c)))return;dA.add(i);out.push(yesNo(a,{type:"city",city:asList(a.city),at:a.at||"after"}));});
  lgs.forEach((lg,i)=>{if(dL.has(i)||!asList(lg.from).some(c=>locs.includes(c)))return;dL.add(i);const ow={type:"leg",key:legKeyOf(lg),from:asList(lg.from),to:asList(lg.to)};
   (lg.slots||[]).forEach(sl=>out.push(yesNo(Object.assign({},sl,{key:legKeyOf(lg)+"."+sl.key}),ow)));});};
 const eLocs=e=>typeof e==="string"?[e]:e.options.flatMap(o=>o.cities||[]);
 for(const e of sp.cities||[]){if(typeof e!=="string")out.push(Object.assign({},e,{owner:{type:"city"},options:e.options.map(o=>Object.assign({},o,{stops:o.cities||[]}))}));push(eLocs(e));}
 push(at.flatMap(a=>asList(a.city)).concat(lgs.flatMap(lg=>asList(lg.from)),lgs.flatMap(lg=>asList(lg.to))));
 if(sp.end)out.push(Object.assign({},sp.end,{owner:{type:"end"}}));
 DECS[sp.id]=out;return out;}
const choicesOf=sp=>{const ch={};for(const d of decs(sp))ch[d.key]=sel[SID(sp)+"/"+d.key]??d.default??0;return ch;};
function orderedCities(sp,ch){let list=[],order=null;const byKey={};let rev=false;

 /* the stepper is the row stepper, exactly: same buttons, same figure, no unit word — the label already says nights */
 F.push(fld("Total nights",
  `<span class="nn tgt"><button data-tgt="-1"${target<=1?" disabled":""} aria-label="One night fewer">−</button>`
  +`<span class="n">${target}</span>`
  +`<button data-tgt="1"${target>=40?" disabled":""} aria-label="One night more">+</button></span>`,
  `runs ${sp.band.join("–")}`));
 /* where the trip starts, and which way round it runs, are route decisions — they sit in the row as fields like the
  * rest, not as a line of their own. Where the reverse IS one of the start options it stays in Start under its own
  * name: one choice, one field. A route with neither keeps neither field */
 const sd=startDec(sp),dd=dirDec(sp);
 if(sd)F.push(fld("Start",choiceHtml(T,sd,o=>o.label,sd.question||"Where does the trip start?")));
 if(dd&&(!sd||dd.key!==sd.key))
  F.push(fld("Direction",choiceHtml(T,dd,o=>o.label||(o.reverse?"The other way round":"As drawn"),dd.question||"Which way round?")));
 const over=T.total-target,tone=over>0?"over":over<0?"under":"";
 const flag=over>0?`${over} too many`:over<0?`${-over} too few`:"";
 F.push(`<div class="pf"><span class="pfl">Nights on the route</span><span class="pfv num${tone?" "+tone:""}">${T.total}</span>${flag?`<span class="pfc ${tone}">${esc(flag)}</span>`:""}</div>`);
 F.push(`<div class="pf"><span class="pfl">Travel</span><span class="pfv num">${hmS(T.mins)}</span>${T.unk?`<span class="pfc">+ ${T.unk} to confirm</span>`:""}</div>`);
 F.push(fld("Arrive",esc(apName(T.apIn)),""));
 F.push(fld("Depart",esc(apName(T.apOut)),""));
 return `<div class="chat"><div class="pfs">`+F.join("")+`</div></div>`;}
/* the one bar control the list itself does not own: the target nights */
document.addEventListener("click",e=>{const t=e.target.closest?e.target.closest("[data-tgt]"):null;
 if(!t||t.disabled)return;
 if(cur)Object.keys(nightsOv).forEach(k=>{if(k.indexOf(SID(cur)+"/")===0)delete nightsOv[k];});
 setHash({nights:Math.max(1,Math.min(40,target+(+t.dataset.tgt))),set:setPart(true),n:""});});

/* ---------- the page ---------- */
function giveHtml(T){const stops=planStr(T.st);
 const cmd=`plan "${stops}" --in ${T.apIn} --out ${T.apOut}`;
 /* the command is the route tool's own shorthand, place ids and all; the line above it is the same plan in the names
  * the page uses, so the couple can read what they are handing over before they hand it over */
 const plan=T.st.map(s=>`${esc(nm(s.loc))} <b>${s.n}</b>`).join(`<span class="s">·</span>`);
 return `<div class="give"><b>Give this to your assistant</b><div class="plan">${plan}<span class="s">·</span>in at <b>${esc(apName(T.apIn))}</b><span class="s">·</span>home from <b>${esc(apName(T.apOut))}</b></div><div class="cbox"><code id="cmd">${esc(cmd)}</code>`
 +`<button class="copy" data-copy="1">Copy</button></div>`
 +`<p>Paste that line into the chat and the kit's route tool prices the whole trip, leg by leg, and checks it.</p></div>`;}
/* the routes under discussion, in the order the link names them — the rest wait behind one button */
let MORE=false;
/* the routes under discussion: pinned from any section of the address */
function pinned(){const out=[];
 SECTIONS.forEach(p=>String(p.routes||"").split(",").forEach(q=>{const sp=findSpine(q);if(sp&&out.indexOf(sp)<0)out.push(sp);}));
 return out;}
const secSpine=p=>isPlanSec(p)?null:findSpine(p.spine);
function tabName(p,i){if(isPlanSec(p)){const ps=SECTIONS.filter(isPlanSec);
  return ps.length<2?"Your plan":"Your plan "+(ps.indexOf(p)+1);}
 const sp=secSpine(p);return sp?sp.name:(p.spine||"Route");}
function tabsHtml(sp){const pin=pinned(),mine=SECTIONS.map(secSpine);
 /* one route, no routes pinned: the nine tabs, exactly as they were. A plan on its own keeps its own tab instead */
 if(SECTIONS.length<2&&!pin.length&&!isPlanSec(SECTIONS[0]))
  return `<div class="tabs" role="group" aria-label="The nine routes">`
  +spines.map(x=>`<button class="tab${x===sp?" on":""}" data-tab="${esc(slugOf(x))}">${esc(x.name)}</button>`).join("")
  +`</div>`;
 const extra=pin.filter(x=>mine.indexOf(x)<0),rest=spines.filter(x=>mine.indexOf(x)<0&&extra.indexOf(x)<0);
 return `<div class="tabs" role="group" aria-label="The routes">`
 +SECTIONS.map((p,i)=>`<button class="tab${i===SEC?" on":""}" data-sec="${i}">${esc(tabName(p,i))}</button>`).join("")
 +extra.concat(MORE?rest:[]).map(x=>`<button class="tab" data-tab="${esc(slugOf(x))}">${esc(x.name)}</button>`).join("")
 +(rest.length?`<button class="tab more" data-more="1">${MORE?"Fewer routes":"Explore more routes"}</button>`:"")
 +`</div>`;}
function pageHtml(sp){
 /* a link that could mean two routes picks neither: the tabs stand open and the page says so in a line */
 if(!sp)return tabsHtml(null)+`<p class="prompt">Which route? <b>${esc(ask||"")}</b> matches more than one of them — pick one above.</p>`;
 const T=trip(sp);
 /* no prose about the route: the selected tab names it, the row and the list say what it is. The chat does the
  * describing (owner, 2026-09-12) */
 return tabsHtml(sp)
 +`<div class="core">${barHtml(T,sp)}<div class="tl"><div class="pairF">${mapCtl(T,sp)}${itinHtml(T,sp)}</div></div>${giveHtml(T)}</div>`;}

function planPageHtml(p){const T=planTrip(p);
 if(!T.st.length)return tabsHtml(null)+`<p class="prompt">This plan has no stops the kit knows. Ask the chat for the stop string again.</p>`;
 return tabsHtml(null)
 +`<div class="core">${planBarHtml(T)}<div class="tl"><div class="pairF">${mapCtl(T,null)}${itinHtml(T,null)}</div></div>${giveHtml(T)}</div>`;}
const app=document.getElementById("app");
let lastSig=null;
function render(){readHash();
 const p=hashParams();
 if(isPlanSec(p)){app.innerHTML=planPageHtml(p);fitMaps();return;}
 if(cur){const sd=startDec(cur),dd=dirDec(cur);
  const sig=[SEC,cur.id,target,sd?sel[SID(cur)+"/"+sd.key]:"",dd?sel[SID(cur)+"/"+dd.key]:""].join("|");
  if(sig!==lastSig){lastSig=sig;if(!NFIX)spendNights(cur);}}
 app.innerHTML=pageHtml(cur);if(cur)fitMaps();}
render();
addEventListener("hashchange",render);
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(fitMaps,120);});

/* ---------- the four things a click can mean ---------- */
function act(el){
 const more=el.closest?el.closest("[data-more]"):null;
 if(more){MORE=!MORE;render();return true;}
 /* a tab of its own in the address: opening it changes nothing but which one is on screen */
 const sec=el.closest?el.closest("[data-sec]"):null;
 if(sec){SEC=Math.max(0,Math.min(SECTIONS.length-1,+sec.dataset.sec));render();return true;}
 const tab=el.closest?el.closest("[data-tab]"):null;
 /* the nights asked for, the repeat visit and the routes under discussion belong to the trip and stay; the answers, the
  * nights on screen, the start, the direction — and the ticket, which is now flown to as written — belong to the route
  * being left, so a route opened from a tab states its own airports (owner, 2026-09-13) */
 if(tab){const slug=tab.dataset.tab,secs=readSections();
  const at=secs.findIndex(p=>!isPlanSec(p)&&secSpine(p)&&slugOf(secSpine(p))===slug);
  if(at>=0){SEC=at;render();return true;}
  /* one route on the address: the tab replaces it, as it always did (a plan is never replaced — it opens beside it) */
  if(secs.length<2&&!pinned().length&&!isPlanSec(secs[0])){SEC=0;setHash({spine:slug,plan:"",start:"",reverse:"",set:"",n:"",in:"",out:""});return true;}
  /* a route the address only pins: it opens in a tab of its own, at its own defaults and its own airports */
  const fresh={spine:slug};["nights","repeat"].forEach(k=>{if(secs[SEC]&&secs[SEC][k])fresh[k]=secs[SEC][k];});
  const t=addedSec>0&&addedSec<secs.length?secs[addedSec]:null;
  if(t&&SEC===addedSec&&!t.set&&!t.n)secs[addedSec]=fresh;else{secs.push(fresh);addedSec=secs.length-1;}
  SEC=addedSec;writeSections(secs);return true;}
 /* the plan tab: a night either way, or a stop off the plan */
 const prm=el.closest?el.closest("[data-prm]"):null;
 if(prm){const st=planStops(hashParams()),i=+prm.dataset.prm;
  if(!st[i])return true;const gone=st.splice(i,1)[0];
  const off=(PLANOFF[SEC]=PLANOFF[SEC]||[]);off.forEach(x=>{if(x.at>i)x.at--;});
  off.push({loc:gone.loc,n:gone.n,at:i,orig:i});
  setHash({plan:planStr(st)});return true;}
 /* the dashed row of a stop taken off: it goes back where it was */
 const pk=el.closest?el.closest("[data-pk]"):null;
 if(pk){const off=PLANOFF[SEC]||[],x=off[+pk.dataset.pk];if(!x)return true;
  const st=planStops(hashParams()),at=Math.min(x.at,st.length);st.splice(at,0,{loc:x.loc,n:x.n});
  off.splice(+pk.dataset.pk,1);off.forEach(y=>{if(y.at>at)y.at++;});
  setHash({plan:planStr(st)});return true;}
 const pn=el.closest?el.closest("[data-nk]"):null;
 if(pn&&String(pn.dataset.nk).indexOf("p:")===0){if(pn.disabled)return true;
  const st=planStops(hashParams()),i=+String(pn.dataset.nk).slice(2);const x=st[i];if(!x)return true;
  x.n=Math.min(stepMax(x.loc),Math.max(1,x.n+(+pn.dataset.d)));setHash({plan:planStr(st)});return true;}
 if(!cur)return false;
 const sw=el.closest?el.closest("[data-sw]"):null;
 if(sw){if(sw.disabled)return true;const d=decs(cur).find(x=>x.key===sw.dataset.sw);
  if(!d)return true;
  /* the shape of the trip changes but the reader's own nights do not: a place that survives the flip keeps the count
   * they set, and the rest of the trip is fitted around it. The two airports move with the route, so the link the page
   * is holding is rewritten to the ones it now flies — otherwise the old ticket would pull the route back */
  sel[SID(cur)+"/"+d.key]=+sw.dataset.j;
  const ap=airportsOf(cur,stopsOf(cur),true);
  const patch={in:ap[0]&&ap[0]!=="—"?ap[0]:"",out:ap[1]&&ap[1]!=="—"?ap[1]:""};
  if(isStart(d))patch.start=sw.dataset.j;else patch.reverse=d.options[+sw.dataset.j].reverse?"1":"";
  keepHash(patch);
  return true;}
 const nb=el.closest?el.closest("[data-nk]"):null;
 if(nb){if(nb.disabled)return true;const key=nb.dataset.nk,loc=key.slice(key.indexOf("/")+1,key.lastIndexOf("#"));
  const st=fit(cur).find(s=>s.key===key);if(!st)return true;
  nightsOv[key]=Math.min(stepMax(loc),Math.max(1,st.n+(+nb.dataset.d)));keepHash();return true;}
 const k=el.dataset&&el.dataset.k!=null?el:(el.closest?el.closest("[data-k]"):null);
 if(k){String(k.dataset.off||"").split(",").filter(Boolean).forEach(pr=>{const i=pr.lastIndexOf(":");
   if(i>0)sel[SID(cur)+"/"+pr.slice(0,i)]=+pr.slice(i+1);});
  sel[SID(cur)+"/"+k.dataset.k]=+k.dataset.j;
  /* an option that flies home from somewhere else moves the ticket with it */
  const dk=decs(cur).find(x=>x.key===k.dataset.k),ok=(dk&&dk.options[+k.dataset.j])||{},pk={};
  if(ok.in)pk.in=ok.in;if(ok.out)pk.out=ok.out;
  keepHash(pk);return true;}
 return false;}
app.addEventListener("click",e=>{
 const c=e.target.closest("[data-copy]");
 if(c){const t=document.getElementById("cmd").textContent;
  const done=()=>{c.textContent="Copied";setTimeout(()=>{c.textContent="Copy";},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));
  else fallback(t,done);return;}
 act(e.target);});
function fallback(t,done){const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");
 a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
 try{document.execCommand("copy");done();}catch(err){}a.remove();}
app.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;
 const t=e.target;if(!t||!t.getAttribute||t.getAttribute("role")!=="button")return;
 e.preventDefault();act(t);});
/* a field whose value is a choice rewrites the route the moment it changes — and the ticket with it, since the two
 * airports move with the route (the same patch the old links applied) */
app.addEventListener("change",e=>{const sl=e.target.closest?e.target.closest("[data-sel]"):null;
 if(sl){if(!cur)return;const d=decs(cur).find(x=>x.key===sl.dataset.sel);if(!d)return;
  sel[SID(cur)+"/"+d.key]=+sl.value;
  const ap=airportsOf(cur,stopsOf(cur),true);
  const patch={in:ap[0]&&ap[0]!=="—"?ap[0]:"",out:ap[1]&&ap[1]!=="—"?ap[1]:""};
  if(isStart(d))patch.start=sl.value;else patch.reverse=d.options[+sl.value].reverse?"1":"";
  keepHash(patch);return;}
 if(e.target.id!=="nights")return;
 const v=parseInt(e.target.value,10);
 /* a new total is a new fit: the figures the page was holding are let go, the answers are kept */
 Object.keys(nightsOv).forEach(k=>{if(cur&&k.indexOf(SID(cur)+"/")===0)delete nightsOv[k];});
 setHash({nights:v>0?Math.min(40,v):"",set:setPart(true),n:""});});
</script>
